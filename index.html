<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#193b37">
  <title>Inscrição | CLX</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #e8f4fc;
      --muted: #a3b8c9;
      --line: #294353;
      --paper: #08141d;
      --surface: #10202b;
      --forest: #0b1c27;
      --green: #72f3b1;
      --lime: #b8ff5a;
      --focus: #27def2;
      --error: #ff8290;
      --red: #b7453e;
      font-family: "Aptos", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 34px 18px;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(rgba(39, 222, 242, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(39, 222, 242, .035) 1px, transparent 1px);
      background-size: 34px 34px;
    }
    .shell { width: min(100%, 860px); margin: 0 auto; }
    .masthead { display: flex; align-items: center; gap: 12px; margin: 0 0 24px; }
    .mark { display: grid; width: 44px; height: 44px; place-items: center; border-radius: 13px 13px 13px 4px; background: var(--lime); color: var(--forest); font-weight: 900; }
    .masthead strong { display: block; font-size: 1rem; }
    .masthead span { display: block; margin-top: 2px; color: var(--muted); font-size: .84rem; }
    .form-card { padding: clamp(22px, 5vw, 42px); border: 1px solid var(--line); border-top: 2px solid var(--focus); border-radius: 8px; background: var(--surface); box-shadow: 0 20px 55px rgba(0, 0, 0, .3), 0 0 32px rgba(39, 222, 242, .06); }
    h1 { margin: 0; font-size: clamp(1.65rem, 4vw, 2.15rem); }
    .intro { margin: 8px 0 28px; color: var(--muted); line-height: 1.5; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px 18px; }
    .field { display: grid; align-content: start; gap: 7px; }
    .field label { font-size: .84rem; font-weight: 700; }
    .field input { width: 100%; min-height: 46px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 5px; background: #091720; color: var(--ink); font: inherit; outline: none; }
    .field input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(39, 222, 242, .15); }
    .field-wide { grid-column: 1 / -1; }
    .consent { display: flex; align-items: flex-start; gap: 10px; margin: 24px 0 18px; color: #bdcbd7; font-size: .88rem; line-height: 1.5; }
    .consent input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--focus); flex: 0 0 auto; }
    .submit { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border: 0; border-radius: 5px; background: var(--focus); color: #06202a; font: inherit; font-weight: 800; cursor: pointer; }
    .submit:hover:not(:disabled) { background: #7af2ff; }
    .submit:disabled { cursor: wait; opacity: .65; }
    .status { min-height: 24px; margin: 14px 0 0; color: var(--muted); font-size: .9rem; }
    .status.error { color: var(--error); }
    .status.success { color: var(--green); font-weight: 700; }
    .footer-note { margin: 18px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.5; }
    @media (max-width: 600px) {
      body { padding: 20px 12px; }
      .fields { grid-template-columns: 1fr; gap: 14px; }
      .field-wide { grid-column: auto; }
      .submit { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="mark" aria-hidden="true">CLX</div>
      <div><strong>Jornal CLX</strong><span>Formulário de inscrição</span></div>
    </header>

    <section class="form-card">
      <h1>Inscrição</h1>
      <p class="intro">Preencha seus dados para solicitar sua inscrição no jornal.</p>

      <form id="registration-form">
        <div class="fields">
          <div class="field">
            <label for="category">Categoria</label>
            <input id="category" name="category" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="role">Cargo</label>
            <input id="role" name="role" autocomplete="organization-title" required>
          </div>
          <div class="field field-wide">
            <label for="name">Nome completo</label>
            <input id="name" name="name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required>
          </div>
          <div class="field">
            <label for="rg">RG</label>
            <input id="rg" name="rg" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="birth-date">Data de nascimento</label>
            <input id="birth-date" name="birthDate" type="date" autocomplete="bday" required>
          </div>
          <div class="field">
            <label for="phone">Telefone</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000" required>
          </div>
          <div class="field field-wide">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="join-date">Mês e ano que entrou no jornal</label>
            <input id="join-date" name="joinDate" type="month" required>
          </div>
        </div>

        <label class="consent" for="consent">
          <input id="consent" name="consent" type="checkbox" required>
          <span>Concordo com o envio destes dados ao sistema do Jornal CLX para registro da inscrição.</span>
        </label>
        <button id="submit-button" class="submit" type="submit" disabled>Conectando...</button>
        <p id="status" class="status" role="status" aria-live="polite">Conectando ao sistema...</p>
      </form>
      <p class="footer-note">Carimbo de data e origem da inscrição serão registrados automaticamente. Envie os dados somente se estiver de acordo com o uso para cadastro no jornal.</p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBiBWPAEjNjzWFrws6HnZ-_Kziiwq1d0Zs",
      authDomain: "lista-de-chamada-44bb7.firebaseapp.com",
      projectId: "lista-de-chamada-44bb7",
      storageBucket: "lista-de-chamada-44bb7.firebasestorage.app",
      messagingSenderId: "835709176234",
      appId: "1:835709176234:web:4bf4b225cd49f6420c43d3"
    };
    const appId = "chamada-clx-v1";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const form = document.getElementById("registration-form");
    const submitButton = document.getElementById("submit-button");
    const status = document.getElementById("status");
    const fields = ["category", "role", "name", "cpf", "rg", "birthDate", "phone", "email", "joinDate"];

    function setStatus(message, kind = "") {
      status.textContent = message;
      status.className = `status ${kind}`.trim();
    }

    try {
      await signInAnonymously(auth);
      submitButton.disabled = false;
      submitButton.textContent = "Enviar inscrição";
      setStatus("Preencha o formulário para enviar sua inscrição.");
    } catch (error) {
      console.error("Falha ao conectar ao Firebase:", error);
      submitButton.textContent = "Indisponível";
      setStatus("Não foi possível conectar ao sistema. Tente novamente mais tarde.", "error");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!form.reportValidity() || !auth.currentUser) return;
      submitButton.disabled = true;
      submitButton.textContent = "Enviando...";
      setStatus("Enviando seus dados...");

      const person = Object.fromEntries(fields.map(field => [field, document.getElementById(field === "birthDate" ? "birth-date" : field === "joinDate" ? "join-date" : field).value.trim()]));
      try {
        await addDoc(collection(db, "artifacts", appId, "public", "data", "people"), {
          ...person,
          timestamp: Date.now(),
          username: "Site de inscrição"
        });
        form.reset();
        submitButton.disabled = false;
        submitButton.textContent = "Enviar outra inscrição";
        setStatus("Inscrição enviada com sucesso.", "success");
      } catch (error) {
        console.error("Falha ao salvar inscrição:", error);
        submitButton.disabled = false;
        submitButton.textContent = "Tentar novamente";
        setStatus("Não foi possível enviar. Verifique sua conexão ou fale com a equipe do jornal.", "error");
      }
    });
  </script>
</body>
</html>
